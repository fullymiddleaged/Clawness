name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Lint rules
        run: python -m clawness.cli --rules-dir ./rules lint

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Benchmark retrieval
        run: python -m clawness.cli --rules-dir ./rules bench

      - name: Retrieval quality (MRR@5 + hit-rate floors)
        run: python -m clawness.cli --rules-dir ./rules eval --floor-mrr 0.85 --floor-hit 0.95

  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (the adapter shells out to the real hooks)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & test the OpenClaw adapter
        working-directory: openclaw
        run: |
          npm install
          npm test

      - name: Check plugin compatibility against the OpenClaw SDK (offline)
        working-directory: openclaw
        run: npm run plugin:check

      - name: Verify committed dist/src is in sync with source
        working-directory: openclaw
        run: |
          npm run build
          git diff --exit-code dist/src \
            || { echo "openclaw/dist/src is stale. Run 'npm run build' in openclaw/ and commit dist/src (git installs load the prebuilt entry)."; exit 1; }
