id: ENF-MEM-001
domain: workflows
severity: info
tags: [memory, lessons, gotcha, correction, retrospective, journal]
triggers: [remember, lesson, again, every time, same mistake, gotcha, note for next time]
when: Any session — a correction repeats, a gotcha costs real time, or the user says to remember something.
rule: >
  Maintain .clawness/memory.md yourself; don't wait to be asked. When a correction
  repeats, a fix costs real time to rediscover, or the user says "remember this",
  append a bullet under '## Lessons' (newest last) naming the trap and the fix: one
  line, 120 chars max, no paragraphs or code blocks. Edit a near-duplicate rather
  than adding one. '## Always' holds at most 3 always-on bullets. Prune what no
  longer holds; past 40, merge the weakest before adding.
violation: "A six-line entry pasting the whole failing command, added while three near-identical bullets already sit above it"
correct: "- eval fails unless CLAW_NO_PLAN_GATE is unset — the gate tests assert it is on"
