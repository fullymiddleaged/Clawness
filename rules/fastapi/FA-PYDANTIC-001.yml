id: FA-PYDANTIC-001
domain: fastapi
severity: error
tags: [pydantic, model, schema, validation, request, response, BaseModel]
triggers: [BaseModel, schema, model, request, response, body, Field, validator, pydantic]
when: Defining request or response shapes for any endpoint.
rule: >
  Define Pydantic models for every request body and response. Never
  accept or return raw dicts. Use separate models for create, update,
  and read operations (UserCreate, UserUpdate, UserRead). Set
  model_config with from_attributes=True for ORM integration. Use
  Field() for validation constraints (min_length, ge, le, regex).
  Check the pinned Pydantic major first: v2 is current, and its
  model_config / from_attributes / model_dump have no equivalent in v1,
  so writing v2 code against a v1 pin fails at import. On v2, drop the v1
  patterns (.dict(), class Config, @validator); on a project still pinned
  to v1, write v1 and say that upgrading is the real fix.
violation: "@app.post('/users') async def create(data: dict)"
correct: "@app.post('/users', response_model=UserRead) async def create(data: UserCreate)"

# Reviewed against current official docs, August 2026.
# Checked against Pydantic 2.13: model_config/ConfigDict, from_attributes,
# Field(), and model_dump/field_validator superseding the v1 forms.
applies_to: {"Pydantic": "2"}
verified: "2026-08"
sources:
  - https://pydantic.dev/docs/validation/latest/concepts/models/
