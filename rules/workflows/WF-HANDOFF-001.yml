id: WF-HANDOFF-001
domain: workflows
severity: info
tags: [handoff, handover, session, context, wrap, resume, continuity]
triggers: [handoff, handover, wrap up, new session, fresh session, pick up where, out of context, running out of context, start over]
when: The user asks for a handoff, or is about to end a session with work still in flight.
rule: >
  Write the handoff to .clawness/handoff.md at the project root — that exact path,
  because Clawness injects that file at the start of the next session in this
  codebase. If one is already there, move it to .clawness/handoffs/done/ named by
  timestamp (e.g. 2026-07-26-143000.md) before writing the new one; that file's
  presence is what marks a handoff as outstanding, so archive it rather than delete
  it. Keep it SHORT — a running start, not a status report. Carry enough context
  that the next action makes sense on its own and no more; ten to fifteen lines is
  usually plenty. Cover what we were doing and where it stopped, the single next
  action, anything uncommitted or half-finished, and open questions. Write the next
  action as
  something someone can do immediately — the command to run or the file and change
  to make, not a topic. Name files and branches explicitly; the next session has
  none of this context. The next session is told to begin work when the user says
  to carry on, so any genuine blocker must appear under open questions; write
  'none' when there is none. Don't restate what the git log, the plan file or the
  code already says, and don't summarise the session. Durable lessons go in
  .clawness/memory.md — a handoff is transient.
violation: "A 30-line report recapping everything the session did, or a next action reading 'continue the refactor'"
correct: "'Split the session store out of auth.py, got to step 6a. Next: point verify_token at sessions_v2 in auth.py, then pytest tests/test_auth.py. Uncommitted: auth.py. Open questions: none.'"
