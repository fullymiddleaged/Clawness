id: WF-HANDOFF-001
domain: workflows
severity: info
tags: [handoff, handover, session, context, wrap, resume, continuity]
triggers: [handoff, handover, wrap up, new session, fresh session, pick up where, out of context, running out of context, start over]
when: The user asks for a handoff, or is about to end a session with work still in flight.
rule: >
  Write the handoff to .clawness/handoff.md at the project root — that exact path,
  because Clawness injects that file at the start of the next session in this
  codebase. If one is already there, move it to .clawness/handoffs/done/ named by
  timestamp (e.g. 2026-07-26-143000.md) before writing the new one; that file's
  presence is what marks a handoff as outstanding, so archive it rather than delete
  it. Four short sections: where we left off, current state (including anything
  uncommitted or half-finished), the single next step, and open questions. Write the
  next step as an instruction someone can act on immediately — the command to run or
  the file and change to make, not a topic. The next session is told to start work
  when the user says to carry on, so anything genuinely blocked on the user must be
  written under open questions; that section says 'none' unless a real decision is
  outstanding. Name files and branches explicitly; the next session has none of this
  context. Keep it under 30 lines. Put durable lessons in .clawness/memory.md
  instead — a handoff is transient.
violation: "A next step reading 'continue the refactor', leaving the next session to re-derive what that means"
correct: "Archiving the old handoff to .clawness/handoffs/done/2026-07-26-143000.md, then writing 'Next: fix tail truncation in render_memory_block (clawness/core.py), then pytest tests/test_memory_rank.py. Open questions: none'"
