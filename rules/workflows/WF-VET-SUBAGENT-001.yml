id: WF-VET-SUBAGENT-001
domain: workflows
severity: warning
tags: [sub-agent, vet, verify, findings, review, proposal, trust, rubber-stamp, orchestrate, critic, confirm]
triggers: [findings, the critic said, review results, subagent reported, agent output, should i trust, verify the finding, applies the findings, sub-agent recommends]
when: A sub-agent has returned findings, a review, or recommendations you are about to act on.
rule: >
  A sub-agent's output is a proposal to verify, not a verdict to obey. Before you
  act on a finding, confirm its specific claim against the actual code or behavior —
  open the file, trace the path, or reproduce it — then explicitly agree, or reject
  it with a reason. Never rubber-stamp a confident-sounding report, and never act on
  a finding you could not verify. A cheaper-tier worker can be confidently wrong, so
  the value of delegating comes from YOUR scrutiny of what it returns, not from the
  report's polish. Prefer findings that carry checkable evidence (file:line, a repro,
  a stated confidence); treat unverifiable ones as leads, not conclusions.
violation: "Applying a critic's or security agent's findings wholesale because they look authoritative"
correct: "Verify each finding against the code, keep the confirmed ones, reject the rest with reasoning"
