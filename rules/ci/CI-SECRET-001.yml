id: CI-SECRET-001
domain: ci
severity: error
tags: [secrets, oidc, credentials, least-privilege, tokens, permissions, ci]
triggers: [ci secrets, deploy credentials, github token, permissions, oidc, service account, store the key]
when: Giving a CI job access to credentials or cloud resources.
rule: >
  Prefer short-lived credentials from OIDC federation over long-lived secrets
  stored in the CI provider: a stored key stays valid until someone remembers to
  rotate it, and every job that can read it can exfiltrate it. Scope token
  permissions per job to the minimum the job needs rather than accepting a
  broadly privileged default, and expose a secret only to the specific step that
  requires it.
violation: "A repo-wide static cloud access key readable by every job, including on forked PRs"
correct: "OIDC role assumption scoped to the deploy job, with per-job least-privilege permissions declared"
