id: FT-IMPLICIT-001
domain: fortran
severity: error
tags: [fortran, implicit-none, modules, interfaces, legacy, common, typos]
triggers: [implicit none, fortran, common block, f77, fixed form, include file, external subroutine, module fortran]
when: Writing or modernising Fortran source.
rule: >
  Put implicit none in every program unit. Without it a mistyped variable name is
  not an error - it silently becomes a new implicitly-typed variable, and the
  program runs and reports a wrong number, which is the single most expensive class
  of Fortran bug. Put procedures in MODULES and use them, so the compiler sees an
  explicit interface and checks argument types, counts and shapes at every call
  site; a bare external subroutine or an INCLUDE file gets none of that checking,
  and a mismatched argument corrupts memory instead of failing to compile. When
  touching legacy code, migrate common blocks to module variables and fixed-form to
  free-form as you go rather than extending the old pattern. Build with the
  compiler's warning and runtime-check flags on during development.
violation: "subroutine solve(n, a)  with no implicit none, called via an INCLUDE'd declaration"
correct: "module solver / implicit none / contains / subroutine solve(n, a) — callers `use solver`"
