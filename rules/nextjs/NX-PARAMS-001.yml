id: NX-PARAMS-001
domain: nextjs
severity: error
tags: [params, searchParams, dynamic-routes, async, promise, slug]
triggers: [params, searchParams, slug, id, "[", dynamic, route, page, await]
when: Accessing route params or search params in page or layout components.
rule: >
  Read the Next.js major from package.json before writing the signature — this
  one changed shape. In Next.js 15+, params and searchParams are Promises and
  must be awaited, which is what enables streaming and parallel data fetching;
  in 14 and earlier they are plain objects, and typing them as Promise<...>
  there is a type error. Match the version installed, and when migrating,
  update every dynamic route page in the same pass.
violation: "function Page({ params }: { params: { slug: string } }) { return params.slug }"
correct: "async function Page({ params }: { params: Promise<{ slug: string }> }) { const { slug } = await params }"

# Reviewed against the Next.js 16.3 docs, August 2026.
# 16 removes the synchronous fallback entirely; the 14-vs-15 split the rule
# describes still holds.
applies_to: {"Next.js": "14-16"}
verified: "2026-08"
sources:
  - https://nextjs.org/docs/app/api-reference/file-conventions/page
  - https://nextjs.org/docs/app/api-reference/file-conventions/layout
  - https://nextjs.org/docs/app/guides/upgrading/version-16
