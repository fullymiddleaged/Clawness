id: NX-ACTION-001
domain: nextjs
severity: warning
tags: [server-actions, server-action, forms, form-submission, mutations, use-server, revalidate, nextjs]
triggers: [use server, server action, server actions, action, form, form submission, submit, create, update, delete, mutation, revalidatePath, revalidateTag]
when: Handling form submissions or data mutations.
rule: >
  Use Server Actions for form mutations (create, update, delete). Define
  them with 'use server' in a separate actions file. After mutating data,
  call revalidatePath or revalidateTag to refresh cached data. Do NOT use
  Server Actions for complex API logic, custom HTTP status codes, or
  non-form programmatic calls — use Route Handlers for those.
violation: "Creating a POST API route just to handle a form submission"
correct: "'use server' action that writes to DB then calls revalidatePath('/dashboard')"

# Reviewed against the Next.js 16.3 docs, August 2026.
# 16 makes revalidateTag's cacheLife argument required and adds
# updateTag/refresh for read-your-writes in Server Actions.
applies_to: {"Next.js": "15"}
verified: "2026-08"
sources:
  - https://nextjs.org/docs/app/getting-started/mutating-data
  - https://nextjs.org/docs/app/guides/upgrading/version-16
